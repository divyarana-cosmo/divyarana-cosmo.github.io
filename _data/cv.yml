cv:
  name: Divya Rana
  label: Postdoctoral Researcher in Observational Cosmology
  email: rana@strw.leidenuniv.nl
  location: Leiden, The Netherlands
  image: ""
  summary: Observational cosmologist using weak lensing and galaxy clustering to connect galaxies to their dark matter halos across scales, from the stellar initial mass function (IMF) to halo outskirts and to cosmology with cosmic shear and gravitational-wave sirens. I combine Euclid, HSC and eROSITA data with image simulations, and coordinate galaxy–galaxy lensing for Euclid Data Release 1.

  sections:
    Interests:
      - name: Cosmology and large-scale structure
        icon: fa-solid fa-tag
        keywords: Galaxy–halo connection with lensing and clustering, Halo outskirts and splashback, Environment, Gravitational-wave cosmology, Tests of ΛCDM
      - name: Galaxies and methods
        icon: fa-solid fa-tag
        keywords: Stellar IMF and galaxy mass budgets, Weak-lensing image simulations and calibration, Photometric-redshift calibration

    Experience:
      - company: Leiden Observatory, Leiden University
        position: Postdoctoral Researcher
        location: Leiden, The Netherlands
        start_date: 2023-10
        end_date: Present
        highlights:
          - "Supervisor: Prof. Dr. Henk Hoekstra"

      - company: Euclid Consortium
        position: Key Project Coordinator, Galaxy–Galaxy Lensing, Data Release 1
        url: https://www.euclid-ec.org/about/contact/dr1-key-project-leads/
        start_date: 2025
        end_date: Present
        highlights:
          - Coordinate the multi-institute, cross-working-group delivery of the DR1 galaxy–galaxy lensing science products (timelines, milestones, communication)
          - Liaison to Euclid Consortium management

    Education:
